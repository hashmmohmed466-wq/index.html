<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>هاشم TV - الرئيسية والمبيعات</title>
    <!-- استدعاء مكتبة Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 flex flex-col min-h-screen">

    <!-- رأس الصفحة -->
    <header class="bg-indigo-900 text-white shadow-md py-4 px-6">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">هاشم TV | المنصة الشاملة</h1>
            <nav class="space-x-4 space-x-reverse">
                <a href="#articles-section" class="hover:text-indigo-200 transition">المقالات</a>
                <a href="#sales-section" class="hover:text-indigo-200 transition">المبيعات والمنتجات</a>
            </nav>
        </div>
    </header>

    <!-- المحتوى الرئيسي -->
    <main class="container mx-auto px-4 py-8 flex-grow space-y-12">
        
        <!-- قسم المقالات -->
        <section id="articles-section" class="bg-white rounded-xl shadow-md p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-indigo-900">📚 أحدث المقالات الثقافية</h2>
                <button onclick="toggleModal('article-modal')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg text-sm transition">+ إضافة مقال جديد</button>
            </div>
            <div id="articles-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- يتم تعبئة المقالات تلقائياً -->
            </div>
        </section>

        <!-- قسم المبيعات والمنتجات التجارية -->
        <section id="sales-section" class="bg-white rounded-xl shadow-md p-6 md:p-8">
            <div class="flex justify-between items-center mb-6 border-b pb-4">
                <h2 class="text-2xl font-bold text-indigo-900">🛍️ قائمة المبيعات والمنتجات</h2>
                <button onclick="toggleModal('sale-modal')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-lg text-sm transition">+ إضافة منتج للبيع</button>
            </div>
            <div id="sales-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- يتم تعبئة المنتجات تلقائياً -->
            </div>
        </section>

    </main>

    <!-- نافذة منبثقة (Modal) لإضافة مقال -->
    <div id="article-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-lg shadow-xl">
            <h3 class="text-xl font-bold mb-4 text-indigo-900">نشر مقال جديد</h3>
            <form onsubmit="event.preventDefault(); addArticle();" class="space-y-4">
                <input type="text" id="art-title" placeholder="عنوان المقال..." required class="w-full border rounded-lg px-3 py-2">
                <textarea id="art-content" rows="4" placeholder="محتوى المقال..." required class="w-full border rounded-lg px-3 py-2"></textarea>
                <div class="flex justify-end space-x-2 space-x-reverse">
                    <button type="button" onclick="toggleModal('article-modal')" class="bg-gray-300 px-4 py-2 rounded-lg">إلغاء</button>
                    <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-lg">حفظ ونشر</button>
                </div>
            </form>
        </div>
    </div>

    <!-- نافذة منبثقة (Modal) لإضافة منتج مبيعات -->
    <div id="sale-modal" class="fixed inset-0 bg-black/50 hidden flex justify-center items-center p-4 z-50">
        <div class="bg-white rounded-xl p-6 w-full max-w-lg shadow-xl">
            <h3 class="text-xl font-bold mb-4 text-emerald-900">إضافة منتج جديد للبيع</h3>
            <form onsubmit="event.preventDefault(); addProduct();" class="space-y-4">
                <input type="text" id="prod-name" placeholder="اسم المنتج (مثلاً: هاتف ذكي، إكسسوارات...)" required class="w-full border rounded-lg px-3 py-2">
                <input type="text" id="prod-price" placeholder="السعر (مثلاً: $250 أو 150,000 SDG)" required class="w-full border rounded-lg px-3 py-2">
                <textarea id="prod-desc" rows="3" placeholder="وصف المنتج ومميزاته..." required class="w-full border rounded-lg px-3 py-2"></textarea>
                <div class="flex justify-end space-x-2 space-x-reverse">
                    <button type="button" onclick="toggleModal('sale-modal')" class="bg-gray-300 px-4 py-2 rounded-lg">إلغاء</button>
                    <button type="submit" class="bg-emerald-600 text-white px-4 py-2 rounded-lg">إضافة للمبيعات</button>
                </div>
            </form>
        </div>
    </div>

    <!-- تذييل الصفحة -->
    <footer class="bg-slate-900 text-slate-400 text-center py-4 text-sm mt-auto">
        <p>جميع الحقوق محفوظة © 2026 - منصة هاشم TV</p>
    </footer>

    <!-- جافاسكريبت للتحكم بالبيانات والعرض -->
    <script>
        // البيانات الافتراضية
        let articles = JSON.parse(localStorage.getItem('hashim_articles')) || [
            { id: 1, title: "جولة في معالم زالنجي ووادى أريبو", content: "تاريخ عريق وطبيعة ساحرة تحكي قصص التراث الأصيل في دارفور.", date: "12 أكتوبر 2026" }
        ];

        let products = JSON.parse(localStorage.getItem('hashim_products')) || [
            { id: 1, name: "هواتف ذكية واكسسوارات حديثة", price: "حسب الطلب", desc: "متوفرة عبر متجر هاشم فون وخدمات التجارة الإلكترونية." }
        ];

        function toggleModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.toggle('hidden');
        }

        function renderAll() {
            // عرض المقالات
            const artGrid = document.getElementById('articles-grid');
            artGrid.innerHTML = articles.map(art => `
                <div class="bg-slate-50 border rounded-xl p-5 shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="text-xs text-indigo-600 font-semibold">${art.date}</span>
                        <h3 class="text-lg font-bold mt-2 text-slate-900">${art.title}</h3>
                        <p class="text-slate-600 text-sm mt-2 line-clamp-3">${art.content}</p>
                    </div>
                    <button onclick="deleteArticle(${art.id})" class="text-red-500 hover:text-red-700 text-xs mt-4 text-right">حذف المقال</button>
                </div>
            `).join('');

            // عرض المنتجات
            const prodGrid = document.getElementById('sales-grid');
            prodGrid.innerHTML = products.map(prod => `
                <div class="bg-emerald-50/50 border border-emerald-100 rounded-xl p-5 shadow-sm flex flex-col justify-between">
                    <div>
                        <span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded font-semibold">متوفر للطلب</span>
                        <h3 class="text-lg font-bold mt-3 text-slate-900">${prod.name}</h3>
                        <p class="text-emerald-700 font-bold mt-1">${prod.price}</p>
                        <p class="text-slate-600 text-sm mt-2">${prod.desc}</p>
                    </div>
                    <div class="flex justify-between items-center mt-4 pt-3 border-t border-emerald-100">
                        <a href="https://wa.me/249998040864" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded transition">طلب عبر واتساب</a>
                        <button onclick="deleteProduct(${prod.id})" class="text-red-500 hover:text-red-700 text-xs">حذف</button>
                    </div>
                </div>
            `).join('');
        }

        function addArticle() {
            const title = document.getElementById('art-title').value;
            const content = document.getElementById('art-content').value;
            
            articles.unshift({
                id: Date.now(),
                title,
                content,
                date: new Date().toLocaleDateString('ar-SA')
            });

            localStorage.setItem('hashim_articles', JSON.stringify(articles));
            toggleModal('article-modal');
            document.getElementById('art-title').value = '';
            document.getElementById('art-content').value = '';
            renderAll();
        }

        function addProduct() {
            const name = document.getElementById('prod-name').value;
            const price = document.getElementById('prod-price').value;
            const desc = document.getElementById('prod-desc').value;

            products.unshift({
                id: Date.now(),
                name,
                price,
                desc
            });

            localStorage.setItem('hashim_products', JSON.stringify(products));
            toggleModal('sale-modal');
            document.getElementById('prod-name').value = '';
            document.getElementById('prod-price').value = '';
            document.getElementById('prod-desc').value = '';
            renderAll();
        }

        function deleteArticle(id) {
            if(confirm('هل أنت متأكد من حذف هذا المقال؟')) {
                articles = articles.filter(a => a.id !== id);
                localStorage.setItem('hashim_articles', JSON.stringify(articles));
                renderAll();
            }
        }

        function deleteProduct(id) {
            if(confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products = products.filter(p => p.id !== id);
                localStorage.setItem('hashim_products', JSON.stringify(products));
                renderAll();
            }
        }

        // التشغيل الأولي
        renderAll();
    </script>
</body>
</html>
